[project]
name = "lottostat-lotto-data"
version = "2.0.0"
description = "Global historical lottery result datasets for LottoStat and their maintenance tools"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18,<5", "beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
